description: >-
  YUMLU KRİPTO MADENCİLİK, Umbrel Bitcoin Node ile çalışan
  kişisel Bitcoin solo mining havuzudur. mkpool v0.3.0 tabanlı
  Stratum V1 sunucusu, vardiff, share ve best difficulty takibi,
  TimescaleDB kayıtları ve özel madencilik dashboardu içerir.

  ASIC madenciler TCP 3333 portuna bağlanır. Solo mining modunda
  Stratum kullanıcı adı olarak Bitcoin ödeme adresi kullanılır.

  Dashboard üzerinde pool hashrate, aktif worker sayısı,
  best share, bulunan blok sayısı, hashrate geçmişi,
  worker bilgileri ve bulunan bloklar görüntülenir.
