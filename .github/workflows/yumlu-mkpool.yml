name: Build YUMLU mkpool image
on:
  push:
    branches: [main]
    paths:
      - 'yumlu-kripto-madencilik/Dockerfile'
      - 'yumlu-kripto-madencilik/dashboard/**'
      - 'yumlu-kripto-madencilik/scripts/**'
      - '.github/workflows/yumlu-mkpool.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./yumlu-kripto-madencilik
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/usame2344/yumlu-mkpool:0.1.0
            ghcr.io/usame2344/yumlu-mkpool:latest
