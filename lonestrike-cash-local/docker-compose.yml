services:
  app_proxy:
    environment:
      APP_HOST: lonestrike-cash-local_dashboard_1
      APP_PORT: 3000

  pool:
    image: ghcr.io/danhaus93-ops/asicseer-pool:latest
    restart: on-failure
    stop_grace_period: 30s
    env_file:
      - /home/umbrel/lonestrike-cash-local.env
    environment:
      RPC_HOST: bitcoin-cash-node_bitcoind_1
      RPC_PORT: "8332"
      ZMQ_ENDPOINT: tcp://bitcoin-cash-node_bitcoind_1:28332
      BCH_ADDRESS: ""
    volumes:
      - ${APP_DATA_DIR}/data/pool:/pool
    ports:
      - "3340:3333"
    networks:
      - default
      - umbrel_main_network

  dashboard:
    image: ghcr.io/danhaus93-ops/solostrike-cash-dashboard:latest
    restart: on-failure
    env_file:
      - /home/umbrel/lonestrike-cash-local.env
    environment:
      POOL_LOGDIR: /pool/logs
      STRATUM_HOST: ${DEVICE_DOMAIN_NAME:-umbrel.local}
      STRATUM_PORT: "3340"
      RPC_HOST: bitcoin-cash-node_bitcoind_1
      RPC_PORT: "8332"
      APP_VERSION: v1.4.71-local.1
    volumes:
      - ${APP_DATA_DIR}/data/pool:/pool
      - ${APP_DATA_DIR}/data/sv2:/sv2
    depends_on:
      - pool
    networks:
      - default
      - umbrel_main_network

  sv2-bridge:
    image: ghcr.io/danhaus93-ops/bchn-sv2-bridge:latest
    restart: on-failure
    env_file:
      - /home/umbrel/lonestrike-cash-local.env
    environment:
      BCHN_RPC_URL: http://bitcoin-cash-node_bitcoind_1:8332
      TP_PORT: "8443"
      SV2_DATA: /data
      ZMQ_ADDR: tcp://bitcoin-cash-node_bitcoind_1:28332
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - umbrel_main_network

  sv2-pool:
    image: ghcr.io/danhaus93-ops/lonestrike-sv2-pool:latest
    restart: on-failure
    environment:
      PAYOUT_ADDRESS: ""
      BRIDGE_ADDR: sv2-bridge:8443
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
    ports:
      - "33333:33333"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - sv2-bridge

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
